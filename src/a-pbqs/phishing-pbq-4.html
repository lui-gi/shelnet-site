<!DOCTYPE html>
<html lang="en" class_name="h-full bg-gray-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CompTIA A+ PBQ: Email Analysis</title>
    <!-- 1. Load Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for the app */
        html, body {
            height: 100%;
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            background-color: #e5e7eb; /* gray-200 */
        }
        
        /* 3-pane layout height */
        .main-layout {
            /* 100% of parent height minus the three header sections */
            height: calc(100% - 144px); 
        }

        /* Style for the "active" (being read) email */
        .email-item.active {
            background-color: #dbeafe; /* Tailwind's blue-100 */
            border-left-color: #3b82f6; /* Tailwind's blue-500 */
        }
        
        /* Style for the "selected" (via checkbox) email */
        .email-item.selected {
             background-color: #e5e7eb; /* Tailwind's gray-200 */
        }
        
        /* Custom tooltip for the link hover */
        #link-hover-tip {
            position: absolute;
            display: none;
            background-color: #1f2937; /* Tailwind's gray-800 */
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.875rem;
            z-index: 50;
            pointer-events: none; /* Allows mouse to pass through */
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-screen-xl mx-auto bg-white rounded-lg shadow-2xl overflow-hidden h-full">
        <!-- Header / Title Bar (Color changed) -->
        <header class="bg-blue-600 text-white p-2 h-10 flex items-center justify-center">
            <h1 class="text-xl font-bold text-center">Corporate Email Client</h1>
        </header>
        
        <!-- Ribbon / Action Bar (Color changed) -->
        <div class="p-2 border-b border-gray-200 bg-white flex items-center space-x-4 h-14">
             <button id="report-btn" class="px-4 py-2 bg-red-600 text-white font-semibold rounded-lg shadow-sm hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-opacity-75 flex items-center space-x-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M3.293 2.293a1 1 0 011.414 0l14 14a1 1 0 01-1.414 1.414l-1.42-1.42a1 1 0 01-.131-1.015l.618-2.473a1 1 0 00-.54-.913l-4.146-2.073a1 1 0 01-.527-.92l.065-2.61a1 1 0 00-.707-.96l-3.322-.83a1 1 0 01-.806-.982l.004-2.21a1 1 0 00-1.414-1.414l-2-2zM10 6.07a1 1 0 00-1.789-.63l-1.589-1.588a1 1 0 010-1.414 1 1 0 011.414 0l1.588 1.588A1 1 0 0010 6.07z" clip-rule="evenodd" />
                </svg>
                <span>Report</span>
            </button>
            <div id="score-display" class="text-lg font-semibold pl-4"></div>
        </div>
        
        <!-- Instructions -->
        <div class="p-3 bg-gray-100 border-b border-gray-200 h-12">
            <p class="text-gray-700 text-sm"><strong>Instructions:</strong> Review the emails. Click an email's text to read it. Use the <strong class="text-blue-600">checkbox</strong> to select suspicious emails. When finished, click the <strong class="text-red-600">Report</strong> button.</p>
        </div>

        <div class="flex flex-row main-layout">
            <!-- Folder Panel (Left) - Purely decorative for the Outlook look -->
            <div class="w-1/6 bg-gray-50 border-r border-gray-200 p-4 hidden md:block">
                <h2 class="text-lg font-semibold mb-4">Folders</h2>
                <ul class="space-y-2">
                    <li class="font-bold text-blue-700 bg-blue-100 p-2 rounded-lg">Inbox (4)</li>
                    <li class="text-gray-700 p-2 rounded-lg hover:bg-gray-100">Sent</li>
                    <li class="text-gray-700 p-2 rounded-lg hover:bg-gray-100">Drafts</li>
                    <li class="text-gray-700 p-2 rounded-lg hover:bg-gray-100">Junk</li>
                    <li class="text-gray-700 p-2 rounded-lg hover:bg-gray-100">Archive</li>
                </ul>
            </div>

            <!-- Inbox Panel (Middle) -->
            <div id="inbox-panel" class="w-full md:w-2/6 border-r border-gray-200 overflow-y-auto">
                <!-- Inbox header added for realism -->
                <div class="p-3 border-b flex space-x-4 sticky top-0 bg-white">
                    <button class="font-semibold text-blue-600 border-b-2 border-blue-600 pb-1">Focused</button>
                    <button class="font-semibold text-gray-500 pb-1 hover:text-gray-700">Other</button>
                </div>
                <!-- Emails will be injected here by JS -->
            </div>

            <!-- Viewer Panel (Right) -->
            <div id="viewer-panel" class="w-full md:w-3/6 p-6 overflow-y-auto relative">
                <div id="viewer-placeholder" class="text-gray-500 text-center text-lg mt-20">
                    Select an email to read it.
                </div>
                <div id="email-content" class="hidden">
                    <div class="border-b pb-4 mb-4">
                        <h2 id="email-subject" class="text-2xl font-semibold text-gray-900"></h2>
                        <p class="text-sm text-gray-600 mt-2">
                            <strong class="text-gray-800">From:</strong> 
                            <span id="email-sender" class="text-gray-700"></span>
                        </p>
                    </div>
                    <div id="email-body" class="prose prose-lg max-w-none text-gray-800 whitespace-pre-wrap">
                        <!-- Email body text will go here -->
                    </div>
                </div>
            </div>
        </div>
        
    </div>
    
    <!-- The custom tooltip element for link hovering -->
    <div id="link-hover-tip"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- 1. DATA ---
            const emails = [
                {
                    id: 1,
                    senderDisplay: 'Finance Department <payroll@company.com>',
                    senderActual: null, // This one is legitimate
                    subject: 'Action Required: Your Paystub is Ready',
                    body: 'Hello Team,\n\nYour paystub for the 10/31 period is now available in the employee portal.\n\nLog in at your convenience: https://portal.company.com\n\n-The Payroll Team',
                    linkDisplayText: null,
                    linkActual: null,
                    isMalicious: false
                },
                {
                    id: 2,
                    senderDisplay: 'Microsooft Support <security.alert@microsoft.com>',
                    senderActual: 'security.alert@micros0oft-support.net', // Red Flag 1: Spoofed sender
                    subject: 'Unusual Sign-in Activity',
                    body: 'We detected an unusual sign-in attempt on your account from a new location (IP: 185.12.33.9).\n\nIf this was not you, please secure your account immediately.\n\nClick here to verify your identity: https://account.microsoft.com/verify-identity\n\nThank you,\nMicrosoft Account Team',
                    linkDisplayText: 'https://account.microsoft.com/verify-identity',
                    linkActual: 'http://bit.ly/msft-secure-1a2b', // Red Flag 2: Spoofed link
                    isMalicious: true
                },
                {
                    id: 3,
                    senderDisplay: 'IT Help Desk <helpdesk@company.com>',
                    senderActual: null,
                    subject: 'Reminder: Scheduled Maintenance Tonight',
                    body: 'This is a reminder that the network file shares will be offline for scheduled maintenance tonight, 11/07, from 10:00 PM to 11:00 PM EST.\n\nNo action is required from you.\n\n-IT Department',
                    linkDisplayText: null,
                    linkActual: null,
                    isMalicious: false
                },
                {
                    id: 4,
                    senderDisplay: 'Amazon.com <orders@amazon.com>',
                    senderActual: 'orders@amzn-prime-shipping.com', // Red Flag 1: Spoofed sender
                    subject: 'Problem with your order #112-9876543-210',
                    body: 'Hello,\n\nWe were unable to process the payment for your recent order. This can happen if the card has expired or billing information is incorrect.\n\nPlease update your payment information within 24 hours, or your order will be cancelled.\n\nUpdate Payment Now: https://www.amazon.com/gp/your-account/payments\n\nWe hope to see you again soon.',
                    linkDisplayText: 'https://www.amazon.com/gp/your-account/payments',
                    linkActual: 'http://192.168.45.10/amzn-login.php', // Red Flag 2: Spoofed link (IP address)
                    isMalicious: true
                }
            ];

            // --- 2. GET DOM ELEMENTS ---
            const inboxPanel = document.getElementById('inbox-panel');
            const placeholder = document.getElementById('viewer-placeholder');
            const emailContent = document.getElementById('email-content');
            const emailSubject = document.getElementById('email-subject');
            const emailSender = document.getElementById('email-sender');
            const emailBody = document.getElementById('email-body');
            const reportBtn = document.getElementById('report-btn');
            const scoreDisplay = document.getElementById('score-display');
            const linkHoverTip = document.getElementById('link-hover-tip');
            
            let activeEmailId = null;

            // --- 3. FUNCTIONS ---

            /**
             * Renders all emails into the inbox panel
             */
            function renderInbox() {
                // Add the "Focused | Other" header
                inboxPanel.innerHTML = `
                    <div class="p-3 border-b flex space-x-4 sticky top-0 bg-white z-10">
                        <button class="font-semibold text-blue-600 border-b-2 border-blue-600 pb-1">Focused</button>
                        <button class="font-semibold text-gray-500 pb-1 hover:text-gray-700">Other</button>
                    </div>
                `;
                
                for (const email of emails) {
                    const item = document.createElement('div');
                    item.className = 'email-item flex items-center p-3 border-b border-l-4 border-l-transparent hover:bg-gray-50';
                    item.dataset.id = email.id;
                    
                    // Checkbox for selection
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.className = 'h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500 mr-3';
                    checkbox.dataset.id = email.id;
                    checkbox.addEventListener('click', (e) => {
                        e.stopPropagation(); // Stop click from bubbling to the read-email listener
                        item.classList.toggle('selected', e.target.checked);
                    });
                    item.appendChild(checkbox);

                    // Email text content
                    const textContent = document.createElement('div');
                    textContent.className = 'flex-1 cursor-pointer overflow-hidden';
                    textContent.innerHTML = `
                        <p class="font-semibold text-gray-800 truncate">${email.senderDisplay.split('<')[0]}</p>
                        <p class="text-sm font-medium text-gray-700 truncate">${email.subject}</p>
                        <p class="text-sm text-gray-500 truncate">${email.body.split('\n')[0]}</p>
                    `;
                    
                    // Click text to read email
                    textContent.addEventListener('click', () => {
                        displayEmail(email.id);
                    });
                    
                    item.appendChild(textContent);
                    inboxPanel.appendChild(item);
                }
            }
            
            /**
             * Displays a single email in the viewer panel
             */
            function displayEmail(id) {
                const email = emails.find(e => e.id === id);
                if (!email) return;

                activeEmailId = email.id;
                
                // Update active state in inbox
                document.querySelectorAll('.email-item').forEach(item => {
                    item.classList.toggle('active', item.dataset.id == id);
                });

                // Hide placeholder, show content
                placeholder.classList.add('hidden');
                emailContent.classList.remove('hidden');

                // Populate content
                emailSubject.textContent = email.subject;
                
                // --- REVISION ---
                // Removed the "WARNING" span.
                // Now, it shows the spoofed sender address directly, making it a subtle red flag.
                const senderName = email.senderDisplay.split('<')[0].trim();
                if (email.senderActual) {
                    // Malicious: Show display name + FAKE sender address
                    emailSender.textContent = `${senderName} <${email.senderActual}>`;
                } else {
                    // Legitimate: Show original sender display
                    emailSender.textContent = email.senderDisplay;
                }
                
                // Handle link spoofing in the body (RED FLAG)
                if (email.linkDisplayText) {
                    emailBody.innerHTML = email.body.replace(
                        email.linkDisplayText, 
                        `<a href="javascript:void(0);" data-hover-link="${email.linkActual}" class="text-blue-600 underline">${email.linkDisplayText}</a>`
                    );
                    
                    // Add hover listeners for the new link
                    const spoofedLink = emailBody.querySelector('a');
                    if (spoofedLink) {
                        spoofedLink.addEventListener('mouseenter', (e) => {
                            linkHoverTip.style.display = 'block';
                            linkHoverTip.textContent = e.target.dataset.hoverLink;
                            linkHoverTip.style.left = `${e.pageX + 10}px`;
                            linkHoverTip.style.top = `${e.pageY + 10}px`;
                        });
                        spoofedLink.addEventListener('mouseleave', () => {
                            linkHoverTip.style.display = 'none';
                        });
                        spoofedLink.addEventListener('mousemove', (e) => {
                            linkHoverTip.style.left = `${e.pageX + 10}px`;
                            linkHoverTip.style.top = `${e.pageY + 10}px`;
                        });
                    }
                } else {
                    emailBody.textContent = email.body;
                }
            }

            /**
             * Calculates the final score
             */
            function calculateScore() {
                reportBtn.disabled = true;
                reportBtn.textContent = 'Submitted';
                reportBtn.classList.add('bg-gray-400', 'hover:bg-gray-400');

                const selectedIds = new Set();
                document.querySelectorAll('input[type="checkbox"]:checked').forEach(checkbox => {
                    selectedIds.add(parseInt(checkbox.dataset.id));
                });

                let allMaliciousSelected = true;
                let noLegitSelected = true;
                let correctActions = 0;
                const totalEmails = emails.length;

                for (const email of emails) {
                    const wasSelected = selectedIds.has(email.id);
                    const itemInBox = document.querySelector(`.email-item[data-id="${email.id}"]`);
                    const checkboxInBox = itemInBox.querySelector('input[type="checkbox"]');
                    checkboxInBox.disabled = true; // Disable checkbox
                    itemInBox.style.pointerEvents = 'none'; // Disable clicking

                    if (email.isMalicious) {
                        if (wasSelected) {
                            // Correct: Reported a malicious email
                            itemInBox.classList.add('bg-green-100');
                            itemInBox.style.borderLeftColor = '#22c55e'; // green-500
                            correctActions++;
                        } else {
                            // Incorrect: Missed a malicious email
                            allMaliciousSelected = false;
                            itemInBox.classList.add('bg-red-100');
                            itemInBox.style.borderLeftColor = '#ef4444'; // red-500
                        }
                    } else { // Legitimate email
                        if (wasSelected) {
                            // Incorrect: Reported a legitimate email
                            noLegitSelected = false;
                            itemInBox.classList.add('bg-red-100');
                            itemInBox.style.borderLeftColor = '#ef4444'; // red-500
                        } else {
                            // Correct: Did not report a legitimate email
                            itemInBox.classList.add('bg-green-100');
                            itemInBox.style.borderLeftColor = '#22c55e'; // green-500
                            correctActions++;
                        }
                    }
                }

                // Final Score Logic (as per your request)
                if (allMaliciousSelected && noLegitSelected) {
                    scoreDisplay.textContent = 'PASS! You correctly identified all threats.';
                    scoreDisplay.className = 'text-lg font-semibold text-green-600';
                } else {
                    scoreDisplay.textContent = 'FAIL. Review the highlighted emails.';
                    scoreDisplay.className = 'text-lg font-semibold text-red-600';
                }
                
                // Add a more detailed score
                scoreDisplay.innerHTML += `<span class="ml-4 text-gray-700 font-medium">(Score: ${correctActions}/${totalEmails} correct actions)</span>`;
            }

            // --- 4. EVENT LISTENERS ---
            reportBtn.addEventListener('click', calculateScore);
            
            // --- 5. INITIALIZE APP ---
            renderInbox();
        });
    </script>
</body>
</html>
