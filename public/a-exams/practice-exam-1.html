<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CompTIA A+ Core 2 | Shelnet Simulation</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #0c0c0c;
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
            --border-color: rgba(255, 255, 255, 0.15);
            --accent-green: #4ade80; /* Tailwind green-400 */
            --accent-green-dim: rgba(74, 222, 128, 0.1);
            --accent-red: #ef4444;
            --font-sans: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            /* Grid Background Effect from App.jsx */
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), 
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* Selection Color */
        ::selection {
            background: rgba(74, 222, 128, 0.3);
            color: #d1fae5;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            position: relative;
            z-index: 10;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* --- Terminal Header Bar --- */
        .terminal-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--border-color);
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-muted);
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .dot.red { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.5); }
        .dot.yellow { background: rgba(234, 179, 8, 0.2); border: 1px solid rgba(234, 179, 8, 0.5); }
        .dot.green { background: rgba(34, 197, 94, 0.2); border: 1px solid rgba(34, 197, 94, 0.5); }

        /* --- Brutal Header Section --- */
        .header {
            padding: 40px 40px 20px 40px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -1px;
            margin-bottom: 10px;
            line-height: 1;
        }

        .header .subtitle {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            display: block;
        }

        /* --- Progress Bar --- */
        .progress-container {
            width: 100%;
            height: 2px;
            background: rgba(255,255,255,0.1);
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-green);
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px var(--accent-green);
        }

        /* --- Content Area --- */
        .content {
            padding: 40px;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px dashed var(--border-color);
        }

        .question-number {
            font-family: var(--font-mono);
            color: var(--accent-green);
            font-size: 0.9rem;
        }

        .domain-tag {
            font-family: var(--font-mono);
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            padding: 4px 12px;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .question-text {
            font-size: 1.25rem;
            line-height: 1.6;
            margin-bottom: 40px;
            color: #eee;
            font-weight: 500;
        }

        /* --- Options --- */
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            position: relative;
        }

        .option:hover {
            border-color: var(--accent-green);
            background: rgba(255,255,255,0.04);
        }

        .option.selected {
            background: var(--accent-green-dim);
            border-color: var(--accent-green);
        }

        .option-label {
            font-family: var(--font-mono);
            margin-right: 20px;
            color: var(--text-muted);
            font-weight: bold;
        }

        .option.selected .option-label {
            color: var(--accent-green);
        }

        .option-text {
            flex: 1;
            font-size: 1rem;
            color: rgba(255,255,255,0.8);
        }

        .option.selected .option-text {
            color: #fff;
        }

        /* --- Buttons --- */
        .navigation {
            display: flex;
            justify-content: space-between;
            margin-top: 50px;
            padding-top: 30px;
            border-top: 1px solid var(--border-color);
        }

        .btn {
            padding: 12px 24px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: #fff;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn:hover:not(:disabled) {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .btn-primary {
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--accent-green);
            color: #000;
            box-shadow: 0 0 15px rgba(74, 222, 128, 0.4);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: var(--border-color);
        }

        /* --- Results Screen --- */
        .results {
            animation: fadeIn 0.5s ease;
        }

        .score-card {
            border: 1px solid var(--border-color);
            background: rgba(255,255,255,0.02);
            padding: 40px;
            text-align: center;
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
        }

        /* Terminal scanline effect for score */
        .score-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: rgba(255,255,255,0.1);
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            50% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .score-number {
            font-size: 5rem;
            font-weight: bold;
            font-family: var(--font-mono);
            margin: 10px 0;
            color: #fff;
        }

        .pass-fail {
            font-family: var(--font-mono);
            font-size: 1.5rem;
            padding: 10px 20px;
            display: inline-block;
            border: 1px solid currentColor;
            margin-top: 20px;
        }

        .pass { color: var(--accent-green); }
        .fail { color: var(--accent-red); }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-color);
            padding: 20px;
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #fff;
            font-family: var(--font-mono);
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.8rem;
            font-family: var(--font-mono);
            text-transform: uppercase;
            margin-top: 5px;
        }

        /* Review Section */
        .review-question {
            border: 1px solid var(--border-color);
            background: rgba(255,255,255,0.02);
            padding: 25px;
            margin-bottom: 20px;
            border-left: 4px solid transparent;
        }

        .review-question.correct { border-left-color: var(--accent-green); }
        .review-question.incorrect { border-left-color: var(--accent-red); }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }

        .review-status.correct { color: var(--accent-green); }
        .review-status.incorrect { color: var(--accent-red); }

        .review-text {
            font-size: 1.1rem;
            color: #fff;
            margin-bottom: 20px;
        }

        .review-answers {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            padding: 15px;
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }

        .answer-line {
            margin-bottom: 8px;
            display: flex;
        }

        .answer-line strong {
            width: 140px;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .explanation {
            margin-top: 15px;
            padding: 15px;
            border-left: 2px solid var(--text-muted);
            background: rgba(255,255,255,0.03);
            font-size: 0.95rem;
            color: #ccc;
        }
        
        .explanation-title {
            font-family: var(--font-mono);
            text-transform: uppercase;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .header h1 { font-size: 2rem; }
            .content { padding: 20px; }
            .question-header { flex-direction: column; align-items: flex-start; gap: 10px; }
            .score-number { font-size: 3rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="terminal-bar">
            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>
            <span style="margin-left: 10px;">bash — user@shelnet-exam: ~</span>
        </div>

        <div class="header">
            <h1>Practice Exam 1</h1>
            <div class="subtitle">C:\Shelnet\Exams> 220-1202 PRACTICE SIMULATION</div>
        </div>
        
        <div class="progress-container">
            <div class="progress-fill" id="progressBar"></div>
        </div>

        <div class="content" id="examContent">
            </div>
    </div>

    <script>
        const examData = [
            {
                q: "A system administrator needs to connect to a Windows server to manage files on a specific share. The administrator wants to map a network drive letter to the share from the command line. Which of the following commands should the administrator use?",
                options: ["netstat", "diskpart", "net use", "ipconfig"],
                correct: 2,
                domain: "Operating Systems",
                explanation: "Correct: The net use command is used to map a network share to a drive letter. For example, net use h: \\\\servername\\sharename connects the H: drive to the specified share."
            },
            {
                q: "A technician is setting up a new Windows 11 computer for a graphic designer. The designer requires a file system that supports large file sizes and provides features such as file compression and encryption. Which of the following file systems should the technician configure on the data drive?",
                options: ["FAT32", "NTFS", "ext4", "HFS+"],
                correct: 1,
                domain: "Operating Systems",
                explanation: "Correct: NTFS (New Technology File System) supports large file sizes, file compression, and encryption (EFS), making it the standard choice for Windows."
            },
             {
                q: "A user reports that their Windows 10 Home computer is running slowly. A technician wants to use a built-in tool to manage startup applications and view real-time resource utilization (CPU, Memory, Disk). Which tool should the technician use?",
                options: ["Device Manager", "Task Manager", "Disk Management", "Event Viewer"],
                correct: 1,
                domain: "Operating Systems",
                explanation: "Correct: Task Manager provides real-time statistics on CPU, memory, and disk usage and includes a 'Startup' tab to manage programs that launch when Windows starts."
            },
            {
                q: "A small business owner wants to upgrade their office computers to Windows 11. They need the ability to join a Windows Active Directory Domain and use BitLocker full disk encryption to protect sensitive client data. Which of the following Windows editions is the minimum required to meet these needs?",
                options: ["Windows 11 Home", "Windows 11 Pro", "Windows 11 Education", "Windows 11 S Mode"],
                correct: 1,
                domain: "Operating Systems",
                explanation: "Correct: Windows 11 Pro is the minimum edition that supports joining a Windows Domain and provides BitLocker full disk encryption. Windows 11 Home does not support these features, Education includes them but isn't the minimum retail edition, and S Mode restricts app installation."
            },
            {
                q: "A technician is working on a Linux server and needs to change the permissions of a script file named deploy.sh so that the owner has read, write, and execute permissions, while the group and others have only read and execute permissions. Which command should the technician run?",
                options: ["chmod 755 deploy.sh", "chown 755 deploy.sh", "ps 755 deploy.sh", "grep 755 deploy.sh"],
                correct: 0,
                domain: "Operating Systems",
                explanation: "Correct: The chmod command modifies file permissions. The octal value 7 (rwx) for the owner and 5 (r-x) for group/others equals 755. chown changes ownership, ps displays processes, and grep searches for text patterns."
            },
            {
                q: "A user requests help finding a specific document on their macOS desktop. The user remembers a keyword inside the document but cannot recall the file name. Which macOS tool should the technician use to quickly locate the file?",
                options: ["Mission Control", "Spotlight", "Keychain", "Boot Camp"],
                correct: 1,
                domain: "Operating Systems",
                explanation: "Correct: Spotlight is the macOS search utility that can find files, apps, and content within documents based on keywords. Mission Control manages windows, Keychain manages passwords, and Boot Camp installs Windows on Mac."
            },
            {
                q: "A help desk technician needs to remotely assist a user who is working from home. The user is on a corporate Windows laptop connected to the company VPN. The technician needs to use a built-in Windows tool to view the user's screen and control the mouse. Which tool is MOST appropriate?",
                options: ["Remote Desktop Connection (RDP)", "SSH", "Quick Assist (or Remote Assistance)", "Telnet"],
                correct: 0,
                domain: "Operating Systems",
                explanation: "Correct: The Remote Desktop Protocol (RDP) client is built into Windows and allows a technician to view and control the desktop of a remote device. SSH provides command-line interface, Quick Assist is also valid but RDP is the primary protocol, and Telnet is insecure."
            },
            {
                q: "A system administrator is preparing to install a new application on a Windows server. The application requires a specific amount of virtual memory to function correctly. Where should the administrator go to configure the paging file size?",
                options: ["Device Manager > Disk Drives", "System Properties > Advanced > Performance Settings", "Disk Management > Shrink Volume", "Task Manager > Performance Tab"],
                correct: 1,
                domain: "Operating Systems",
                explanation: "Correct: Virtual memory (paging file) settings are configured in System Properties under the Advanced tab, specifically within Performance Settings. Device Manager manages drivers, Disk Management manages partitions, and Task Manager displays usage but doesn't allow configuration."
            },
            {
                q: "A technician needs to partition a new 4 TB hard drive for a Windows data server. To utilize the full capacity of the drive as a single volume, which partition style must the technician select?",
                options: ["MBR", "GPT", "FAT32", "CDFS"],
                correct: 1,
                domain: "Operating Systems",
                explanation: "Correct: GPT (GUID Partition Table) supports drives larger than 2 TB and allows for up to 128 partitions. MBR has a 2 TB limit, FAT32 is a file system not a partition style, and CDFS is for optical media."
            },
            {
                q: "A company wants to secure the entry to its server room. They require a physical security control that allows only one person to enter at a time, preventing 'tailgating.' Which solution should they implement?",
                options: ["Biometric lock", "Access control vestibule", "Cable locks", "Privacy filter"],
                correct: 1,
                domain: "Security",
                explanation: "Correct: An access control vestibule (formerly mantrap) consists of two doors where the first must close before the second opens, preventing tailgating. Biometric locks verify identity but don't prevent tailgating, cable locks secure hardware, and privacy filters restrict monitor viewing angles."
            },
            {
                q: "A user receives an email that appears to be from the CEO, asking for an urgent wire transfer to a vendor. The user notices the email address is slightly misspelled. Which type of social engineering attack is this?",
                options: ["Vishing", "Whaling", "Dumpster Diving", "Shoulder Surfing"],
                correct: 1,
                domain: "Security",
                explanation: "Correct: Whaling is a targeted phishing attack aimed at high-level executives or impersonating them to trick employees into authorizing financial transfers. Vishing uses voice/telephone, Dumpster Diving involves searching trash, and Shoulder Surfing involves looking at screens."
            },
            {
                q: "A network administrator is configuring a wireless network for a small office. To provide the strongest available encryption for over-the-air transmissions, which protocol should the administrator select?",
                options: ["WEP", "WPA2-TKIP", "WPA3", "WPA"],
                correct: 2,
                domain: "Security",
                explanation: "Correct: WPA3 is the latest and most secure wireless encryption standard, offering improvements over WPA2. WEP is deprecated and insecure, WPA2 with TKIP is less secure than WPA3 with AES, and WPA is outdated."
            },
            {
                q: "A user reports that their computer is running very slowly and they are seeing pop-up ads even when the web browser is closed. The technician suspects the computer is infected. According to the CompTIA malware removal best practices, what is the FIRST step the technician should take?",
                options: ["Disable System Restore", "Update anti-virus signatures", "Identify and verify malware symptoms", "Schedule scans and run updates"],
                correct: 2,
                domain: "Security",
                explanation: "Correct: The first step in the malware removal process is to investigate and verify the malware symptoms to confirm infection. Quarantining comes after identification, disabling System Restore is step 3, and updating signatures is step 5."
            },
            {
                q: "A system administrator wants to ensure that users on the corporate network cannot access websites known to host malware or illegal content. Which security appliance or software feature should be configured?",
                options: ["Port security", "Content filtering", "MAC filtering", "BitLocker"],
                correct: 1,
                domain: "Security",
                explanation: "Correct: Content filtering allows administrators to block traffic based on data within the content, such as specific URLs, website categories, or keywords. Port security controls switch ports, MAC filtering restricts network access by hardware address, and BitLocker encrypts data at rest."
            },
            {
                q: "A user calls the help desk because they cannot log in to their account. The technician determines that the user has entered the wrong password multiple times, triggering a lockout. Which security policy controls this behavior?",
                options: ["Password complexity", "Failed attempts lockout", "Password expiration", "Least privilege"],
                correct: 1,
                domain: "Security",
                explanation: "Correct: The failed attempts lockout policy disables an account after a specific number of incorrect password attempts to prevent brute-force attacks. Password complexity dictates requirements, password expiration forces periodic changes, and least privilege assigns minimum permissions."
            },
            {
                q: "An administrator needs to secure a Windows workstation that is located in a public lobby. The administrator wants to ensure that anyone can use the computer to browse the web, but no changes can be made to the system settings or installed software. Which account type is BEST suited for this?",
                options: ["Administrator", "Standard User", "Guest Account", "Power User"],
                correct: 2,
                domain: "Security",
                explanation: "Correct: The Guest account provides limited access for temporary users and prevents them from installing software or modifying system settings. Administrator has full control, Standard User allows more persistent access, and Power User is a legacy group with fewer restrictions."
            },
            {
                q: "A mobile device administrator wants to ensure that corporate data on employee smartphones is protected if the device is lost or stolen. Which feature allows the administrator to delete all data from the device over the cellular network?",
                options: ["Full device encryption", "Remote wipe", "Screen lock", "Sideloading"],
                correct: 1,
                domain: "Security",
                explanation: "Correct: Remote wipe allows an administrator to send a command to a mobile device to erase all data, protecting it from unauthorized access if lost or stolen. Full device encryption protects data at rest, screen lock restricts access, and sideloading installs apps from outside official stores."
            },
            {
                q: "A technician is decommissioning old hard drives from a server that contained highly sensitive patient data. The drives will be discarded. Which data destruction method provides the MOST assurance that data cannot be recovered?",
                options: ["Standard formatting", "Shredding", "Low-level formatting", "Re-partitioning"],
                correct: 1,
                domain: "Security",
                explanation: "Correct: Shredding physically destroys the drive mechanism and platters, making data recovery impossible. Standard formatting leaves data recoverable, low-level formatting is generally done at the factory, and re-partitioning doesn't erase underlying data."
            },
            {
                q: "A Windows 10 user reports that their computer displays a 'Blue Screen of Death' (BSOD) and restarts immediately after they install a new video card driver. Which of the following is the BEST first step to resolve the issue?",
                options: ["Reinstall Windows from the recovery partition", "Boot into Safe Mode and roll back the driver", "Run a full antivirus scan", "Replace the video card with a new one"],
                correct: 1,
                domain: "Software Troubleshooting",
                explanation: "Correct: Booting into Safe Mode loads the OS with minimal drivers. If the crash was caused by the new driver, Safe Mode allows the technician to use Device Manager to roll back to the previous working driver. Reinstalling Windows is drastic, a virus scan won't fix a driver crash, and replacing hardware is unnecessary."
            },
            {
                q: "A user reports that their mobile phone battery is draining very quickly, and the device feels hot. The user recently installed several new 'free' utility apps. What is the MOST likely cause?",
                options: ["The battery needs to be recalibrated", "One of the new apps is running resource-intensive processes (malware)", "The OS needs to be updated", "The screen brightness is set too low"],
                correct: 1,
                domain: "Software Troubleshooting",
                explanation: "Correct: High battery utilization and heat are common symptoms of malicious apps (malware) or poorly written apps running background processes or cryptominers. Recalibration is rarely needed, OS updates fix bugs but don't explain sudden drain after app installs, and low brightness conserves battery."
            },
            {
                q: "A technician is troubleshooting a Windows computer that fails to boot. The error message on the screen says 'Boot Configuration Data is missing.' Which command should the technician use in the Recovery Console to attempt to repair this?",
                options: ["bootrec /rebuildbcd", "diskpart", "format c:", "ipconfig /flushdns"],
                correct: 0,
                domain: "Software Troubleshooting",
                explanation: "Correct: The bootrec /rebuildbcd command scans for Windows installations and rebuilds the Boot Configuration Data (BCD) store, which is essential for booting. diskpart manages partitions, format erases data, and ipconfig is for network configuration."
            },
            {
                q: "A user attempts to open a web application on their desktop, but the browser redirects them to a search engine page full of advertisements instead of the correct site. This happens in multiple browsers. What is the most likely issue?",
                options: ["DNS server outage", "Browser hijacking (Malware)", "Expired SSL certificate", "Incorrect time zone settings"],
                correct: 1,
                domain: "Software Troubleshooting",
                explanation: "Correct: Browser redirection to unwanted ad sites is a classic symptom of browser hijacking malware. DNS outage would result in 'Server Not Found' errors, expired SSL certificates generate security warnings, and time zone settings affect clock synchronization."
            },
            {
                q: "A user reports that an app on their Android tablet crashes immediately every time they try to open it. Other apps are working fine. What should the technician do FIRST?",
                options: ["Factory reset the tablet", "Force stop the app and clear its cache", "Replace the tablet's RAM", "Root the device to gain admin access"],
                correct: 1,
                domain: "Software Troubleshooting",
                explanation: "Correct: For a specific app crash, the standard troubleshooting step is to force stop the app and clear its cache/data to resolve corruption. Factory reset wipes all data, RAM is generally not replaceable on tablets, and rooting voids warranties and compromises security."
            },
            {
                q: "A user complains that their laptop has no network connectivity. The technician runs ipconfig and sees the IP address is 169.254.12.45. What does this indicate?",
                options: ["The computer has a valid static IP address", "The computer successfully connected to the VPN", "The computer cannot reach the DHCP server (APIPA)", "The DNS server is down"],
                correct: 2,
                domain: "Software Troubleshooting",
                explanation: "Correct: An IP address in the 169.254.x.x range is an APIPA (Automatic Private IP Addressing) address, assigned when Windows cannot contact a DHCP server. Static IPs are manually assigned, VPNs assign routable IPs, and DNS issues affect name resolution not IP assignment."
            },
            {
                q: "A user reports that they cannot access a shared network drive. The technician determines that the user has 'Read' NTFS permissions but 'Deny' Share permissions for the folder. What is the user's effective permission?",
                options: ["Read", "Write", "Full Control", "Deny (No Access)"],
                correct: 3,
                domain: "Software Troubleshooting",
                explanation: "Correct: When combining NTFS and Share permissions, the most restrictive permission always wins. An explicit 'Deny' overrides any 'Allow' permissions. Read/Write/Full Control are overridden by the Deny permission."
            },

        let currentQuestion = 0;
        let userAnswers = new Array(examData.length).fill(null);
        let examComplete = false;

        function renderQuestion() {
            const content = document.getElementById('examContent');
            const q = examData[currentQuestion];
            
            // Updated HTML structure to match new CSS
            content.innerHTML = `
                <div class="question-header">
                    <div class="question-number">Question ${currentQuestion + 1} / ${examData.length}</div>
                    <div class="domain-tag">${q.domain}</div>
                </div>
                
                <div class="question-text">${q.q}</div>
                
                <div class="options">
                    ${q.options.map((opt, idx) => `
                        <div class="option ${userAnswers[currentQuestion] === idx ? 'selected' : ''}" 
                             onclick="selectAnswer(${idx})">
                            <div class="option-label">[ ${String.fromCharCode(65 + idx)} ]</div>
                            <div class="option-text">${opt}</div>
                        </div>
                    `).join('')}
                </div>
                
                <div class="navigation">
                    <button class="btn" onclick="previousQuestion()" ${currentQuestion === 0 ? 'disabled' : ''}>
                        &lt; PREV
                    </button>
                    <button class="btn btn-primary" onclick="${currentQuestion === examData.length - 1 ? 'submitExam()' : 'nextQuestion()'}">
                        ${currentQuestion === examData.length - 1 ? 'FINISH EXAM' : 'NEXT &gt;'}
                    </button>
                </div>
            `;
            
            updateProgress();
        }

        function selectAnswer(idx) {
            if(examComplete) return; // Prevent changing after submission
            userAnswers[currentQuestion] = idx;
            renderQuestion();
        }

        function nextQuestion() {
            if (currentQuestion < examData.length - 1) {
                currentQuestion++;
                renderQuestion();
                // Optional: Smooth scroll to top
                // window.scrollTo(0, 0); 
            }
        }

        function previousQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
            }
        }

        function updateProgress() {
            const progress = ((currentQuestion + 1) / examData.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
        }

        function submitExam() {
            if (!confirm('CONFIRM SUBMISSION? \n\nNo changes can be made after this point.')) {
                return;
            }
            
            examComplete = true;
            showResults();
        }

        function showResults() {
            let correctCount = 0;
            const results = examData.map((q, idx) => {
                const isCorrect = userAnswers[idx] === q.correct;
                if (isCorrect) correctCount++;
                return {
                    question: q,
                    userAnswer: userAnswers[idx],
                    isCorrect: isCorrect,
                    questionNumber: idx + 1
                };
            });
            
            const score = Math.round((correctCount / examData.length) * 100);
            const passed = score >= 70;
            const passClass = passed ? 'pass' : 'fail';
            
            const content = document.getElementById('examContent');
            content.innerHTML = `
                <div class="results">
                    <div class="score-card">
                        <div class="subtitle">FINAL_CALCULATION</div>
                        <div class="score-number">${score}%</div>
                        <div class="pass-fail ${passClass}">${passed ? 'STATUS: PASSED' : 'STATUS: FAILED'}</div>
                    </div>
                    
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-number" style="color:var(--accent-green)">${correctCount}</div>
                            <div class="stat-label">Correct</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number" style="color:var(--accent-red)">${examData.length - correctCount}</div>
                            <div class="stat-label">Incorrect</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${examData.length}</div>
                            <div class="stat-label">Total Items</div>
                        </div>
                    </div>
                    
                    <h2 style="margin: 40px 0 20px 0; font-family: var(--font-mono); font-size: 1.2rem;">>> REVIEW_LOG</h2>
                    <div class="review-section">
                        ${results.map(r => `
                            <div class="review-question ${r.isCorrect ? 'correct' : 'incorrect'}">
                                <div class="review-header">
                                    <strong>#${r.questionNumber}</strong>
                                    <span class="review-status ${r.isCorrect ? 'correct' : 'incorrect'}">
                                        ${r.isCorrect ? '[ CORRECT ]' : '[ INCORRECT ]'}
                                    </span>
                                </div>
                                
                                <div class="review-text">${r.question.q}</div>
                                
                                <div class="review-answers">
                                    <div class="answer-line">
                                        <strong>Your Input:</strong> 
                                        ${r.userAnswer !== null ? `${String.fromCharCode(65 + r.userAnswer)}. ${r.question.options[r.userAnswer]}` : 'NO DATA'}
                                    </div>
                                    ${!r.isCorrect ? `
                                        <div class="answer-line" style="color: var(--accent-green);">
                                            <strong>Expected:</strong> 
                                            ${String.fromCharCode(65 + r.question.correct)}. ${r.question.options[r.question.correct]}
                                        </div>
                                    ` : ''}
                                </div>
                                
                                <div class="explanation">
                                    <div class="explanation-title">System Note:</div>
                                    <div class="explanation-text">${r.question.explanation}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div style="text-align: center; margin-top: 40px;">
                        <button class="btn btn-primary" onclick="location.reload()" style="margin: 0 auto;">
                            RESTART SIMULATION
                        </button>
                    </div>
                </div>
            `;
            
            document.getElementById('progressBar').style.width = '100%';
            window.scrollTo(0, 0);
        }

        // Initialize the exam
        // Note: Ensure the examData array is fully populated above before running
        renderQuestion();
    </script>
