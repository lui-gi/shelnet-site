<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CompTIA Security+ SY0-701 | Shelnet Simulation</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #0c0c0c;
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
            --border-color: rgba(255, 255, 255, 0.15);
            --accent-green: #4ade80; /* Tailwind green-400 */
            --accent-green-dim: rgba(74, 222, 128, 0.1);
            --accent-red: #ef4444;
            --font-sans: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            /* Grid Background Effect */
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), 
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* Selection Color */
        ::selection {
            background: rgba(74, 222, 128, 0.3);
            color: #d1fae5;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            position: relative;
            z-index: 10;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            min-height: 600px;
            display: flex;
            flex-direction: column;
        }

        /* --- Terminal Header Bar --- */
        .terminal-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--border-color);
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-muted);
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .dot.red { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.5); }
        .dot.yellow { background: rgba(234, 179, 8, 0.2); border: 1px solid rgba(234, 179, 8, 0.5); }
        .dot.green { background: rgba(34, 197, 94, 0.2); border: 1px solid rgba(34, 197, 94, 0.5); }

        /* --- Brutal Header Section --- */
        .header {
            padding: 40px 40px 20px 40px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -1px;
            margin-bottom: 10px;
            line-height: 1;
        }

        .header .subtitle {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            display: block;
        }

        /* --- Progress Bar --- */
        .progress-container {
            width: 100%;
            height: 2px;
            background: rgba(255,255,255,0.1);
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-green);
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px var(--accent-green);
        }

        /* --- Content Area --- */
        .content {
            padding: 40px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px dashed var(--border-color);
        }

        .question-number {
            font-family: var(--font-mono);
            color: var(--accent-green);
            font-size: 0.9rem;
        }

        .domain-tag {
            font-family: var(--font-mono);
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            padding: 4px 12px;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .question-text {
            font-size: 1.25rem;
            line-height: 1.6;
            margin-bottom: 40px;
            color: #eee;
            font-weight: 500;
        }

        /* --- Options --- */
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            position: relative;
        }

        .option:hover {
            border-color: var(--accent-green);
            background: rgba(255,255,255,0.04);
        }

        .option.selected {
            background: var(--accent-green-dim);
            border-color: var(--accent-green);
        }

        .option-label {
            font-family: var(--font-mono);
            margin-right: 20px;
            color: var(--text-muted);
            font-weight: bold;
            min-width: 25px;
        }

        .option.selected .option-label {
            color: var(--accent-green);
        }

        .option-text {
            flex: 1;
            font-size: 1rem;
            color: rgba(255,255,255,0.8);
        }

        .option.selected .option-text {
            color: #fff;
        }

        /* --- Buttons --- */
        .navigation {
            display: flex;
            justify-content: space-between;
            margin-top: auto; 
            padding-top: 50px;
        }

        .btn {
            padding: 12px 24px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: #fff;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn:hover:not(:disabled) {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .btn-primary {
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--accent-green);
            color: #000;
            box-shadow: 0 0 15px rgba(74, 222, 128, 0.4);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: var(--border-color);
        }

        /* --- Results Screen --- */
        .results {
            animation: fadeIn 0.5s ease;
        }

        .score-card {
            border: 1px solid var(--border-color);
            background: rgba(255,255,255,0.02);
            padding: 40px;
            text-align: center;
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
        }

        /* Terminal scanline effect for score */
        .score-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: rgba(255,255,255,0.1);
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            50% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .score-number {
            font-size: 5rem;
            font-weight: bold;
            font-family: var(--font-mono);
            margin: 10px 0;
            color: #fff;
        }

        .pass-fail {
            font-family: var(--font-mono);
            font-size: 1.5rem;
            padding: 10px 20px;
            display: inline-block;
            border: 1px solid currentColor;
            margin-top: 20px;
        }

        .pass { color: var(--accent-green); }
        .fail { color: var(--accent-red); }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-color);
            padding: 20px;
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #fff;
            font-family: var(--font-mono);
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.8rem;
            font-family: var(--font-mono);
            text-transform: uppercase;
            margin-top: 5px;
        }

        /* Review Section */
        .review-question {
            border: 1px solid var(--border-color);
            background: rgba(255,255,255,0.02);
            padding: 25px;
            margin-bottom: 20px;
            border-left: 4px solid transparent;
        }

        .review-question.correct { border-left-color: var(--accent-green); }
        .review-question.incorrect { border-left-color: var(--accent-red); }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }

        .review-status.correct { color: var(--accent-green); }
        .review-status.incorrect { color: var(--accent-red); }

        .review-text {
            font-size: 1.1rem;
            color: #fff;
            margin-bottom: 20px;
        }

        .review-answers {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            padding: 15px;
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }

        .answer-line {
            margin-bottom: 8px;
            display: flex;
        }

        .answer-line strong {
            width: 140px;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .explanation {
            margin-top: 15px;
            padding: 15px;
            border-left: 2px solid var(--text-muted);
            background: rgba(255,255,255,0.03);
            font-size: 0.95rem;
            color: #ccc;
        }
        
        .explanation-title {
            font-family: var(--font-mono);
            text-transform: uppercase;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .header h1 { font-size: 2rem; }
            .content { padding: 20px; }
            .question-header { flex-direction: column; align-items: flex-start; gap: 10px; }
            .score-number { font-size: 3rem; }
            .navigation { flex-direction: column; gap: 15px; }
            .btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="terminal-bar">
            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>
            <span style="margin-left: 10px;">bash — user@shelnet-exam: ~</span>
        </div>

        <div class="header">
            <h1>Practice Quiz 1.1</h1>
            <div class="subtitle">C:\Shelnet\Exams> SY0-701 Objective 1.1</div>
        </div>
        
        <div class="progress-container">
            <div class="progress-fill" id="progressBar"></div>
        </div>

        <div class="content" id="examContent">
            </div>
    </div>

    <script>
        // --- QUIZ DATA ---
        const questions = [
            {
                "q": "A security administrator is configuring a firewall to automatically block traffic from IP addresses known to be associated with botnets. Which of the following best describes this control function?",
                "options": [
                    "Detective",
                    "Deterrent",
                    "Preventive",
                    "Corrective"
                ],
                "correct": 2,
                "domain": "Security Controls",
                "explanation": "Correct: Preventive controls attempt to stop a security incident from occurring. A firewall blocking malicious traffic is a classic example of a technical preventive control as it actively stops the threat."
            },
            {
                "q": "An organization has a legacy application running on an old operating system that cannot be patched due to vendor constraints. To mitigate the risk, the security team isolates the server on a separate VLAN with strict access control lists (ACLs). This is an example of which type of control?",
                "options": [
                    "Compensating",
                    "Directive",
                    "Operational",
                    "Detective"
                ],
                "correct": 0,
                "domain": "Security Controls",
                "explanation": "Correct: Compensating controls provide an alternative measure of security when the primary control (in this case, patching the OS) is not feasible or effective."
            },
            {
                "q": "After a recent data breach, a company updates its Disaster Recovery Plan (DRP) to ensure data can be restored more quickly in the future. Creating and updating this plan falls under which control category?",
                "options": [
                    "Managerial",
                    "Technical",
                    "Physical",
                    "Operational"
                ],
                "correct": 0,
                "domain": "Security Controls",
                "explanation": "Correct: Managerial (or Administrative) controls involve the policies, procedures, and planning that govern security, such as risk management and disaster recovery planning."
            },
            {
                "q": "A Chief Information Security Officer (CISO) implements a new rule requiring all employees to undergo annual phishing awareness training. Which category of control does this training represent?",
                "options": [
                    "Operational",
                    "Physical",
                    "Detective",
                    "Technical"
                ],
                "correct": 0,
                "domain": "Security Controls",
                "explanation": "Correct: Operational controls are people-centric and include day-to-day methods like security awareness training and physical media protection."
            },
            {
                "q": "A data center installs motion sensors and security cameras at all entrances. The security team reviews the footage only after an alarm is triggered. In this scenario, how are the cameras primarily functioning?",
                "options": [
                    "Corrective",
                    "Compensating",
                    "Preventive",
                    "Detective"
                ],
                "correct": 3,
                "domain": "Security Controls",
                "explanation": "Correct: Since the footage is reviewed after an event to investigate what happened, the cameras are serving as a detective control."
            },
            {
                "q": "A company places signs around its perimeter stating '24-Hour Surveillance' and 'Trespassers Will Be Prosecuted.' The primary goal of these signs is to:",
                "options": [
                    "Correct",
                    "Prevent",
                    "Detect",
                    "Deter"
                ],
                "correct": 3,
                "domain": "Security Controls",
                "explanation": "Correct: Deterrent controls, such as warning signs, aim to psychologically discourage an attacker from attempting a breach."
            },
            {
                "q": "An organization discovers a server has been infected with ransomware. The IT team immediately disconnects the server from the network and begins restoring data from an offline backup. The restoration from backup is an example of which control type?",
                "options": [
                    "Detective",
                    "Preventive",
                    "Corrective",
                    "Managerial"
                ],
                "correct": 2,
                "domain": "Security Controls",
                "explanation": "Correct: Corrective controls are designed to remediate or restore systems after an incident has occurred. Restoring from backup fixes the data loss."
            },
            {
                "q": "To comply with government regulations, a company writes a new Acceptable Use Policy (AUP) that mandates how employees handle sensitive data. This policy is an example of a:",
                "options": [
                    "Corrective control",
                    "Directive control",
                    "Technical control",
                    "Physical control"
                ],
                "correct": 1,
                "domain": "Security Controls",
                "explanation": "Correct: Directive controls are administrative measures, such as policies and regulations, that specify rules of behavior or mandate specific actions."
            },
            {
                "q": "A secure facility employs a security guard to verify the badges of everyone entering the building. If a badge is invalid, the guard denies entry. The guard is acting as which category of control?",
                "options": [
                    "Managerial",
                    "Physical",
                    "Directive",
                    "Technical"
                ],
                "correct": 1,
                "domain": "Security Controls",
                "explanation": "Correct: Security guards are a physical security control because they protect the physical facility and tangible assets."
            },
            {
                "q": "An administrator installs an Intrusion Detection System (IDS) to monitor network traffic for suspicious signatures. The IDS sends an email alert to the security team when a potential threat is found but does not block the traffic. This is a:",
                "options": [
                    "Technical Preventive control",
                    "Physical Detective control",
                    "Technical Detective control",
                    "Managerial Corrective control"
                ],
                "correct": 2,
                "domain": "Security Controls",
                "explanation": "Correct: It is Technical (implemented via software/hardware) and Detective (it identifies and alerts on events but does not stop them)."
            },
            {
                "q": "A company uses a UPS (Uninterruptible Power Supply) to ensure servers continue running during a short power outage until the backup generators come online. The UPS is acting as a:",
                "options": [
                    "Detective control",
                    "Corrective / Compensating control",
                    "Directive control",
                    "Managerial control"
                ],
                "correct": 1,
                "domain": "Security Controls",
                "explanation": "Correct: In the context of availability, a UPS is often viewed as corrective (remediating the loss of power immediately) or compensating (mitigating the risk of power failure)."
            },
            {
                "q": "To prevent unauthorized users from accessing sensitive files, the IT department implements file permissions that ensure only the 'HR Group' can read salary data. This implementation of permissions is a:",
                "options": [
                    "Corrective control",
                    "Physical control",
                    "Technical control",
                    "Managerial control"
                ],
                "correct": 2,
                "domain": "Security Controls",
                "explanation": "Correct: File permissions (ACLs) are logical mechanisms implemented in the operating system software, making them technical controls."
            },
            {
                "q": "An organization conducts a background check on all potential new employees before offering them a job. This background check is considered a:",
                "options": [
                    "Managerial / Administrative control",
                    "Technical control",
                    "Corrective control",
                    "Physical control"
                ],
                "correct": 0,
                "domain": "Security Controls",
                "explanation": "Correct: Background checks are administrative procedures governed by HR policies to manage personnel risk."
            },
            {
                "q": "A security team implements a policy requiring two distinct administrators to approve any change to the root firewall configuration. This 'Separation of Duties' is primarily a:",
                "options": [
                    "Technical Detective control",
                    "Operational Corrective control",
                    "Managerial Preventive control",
                    "Physical Deterrent control"
                ],
                "correct": 2,
                "domain": "Security Controls",
                "explanation": "Correct: It is Managerial (a policy/procedure) and Preventive (it stops a single person from making unauthorized changes)."
            },
            {
                "q": "A company installs bollards in front of the main entrance to prevent vehicles from ramming into the lobby. This is an example of a:",
                "options": [
                    "Managerial Deterrent control",
                    "Physical Detective control",
                    "Technical Preventive control",
                    "Physical Preventive control"
                ],
                "correct": 3,
                "domain": "Security Controls",
                "explanation": "Correct: Bollards are physical barriers that physically stop vehicles from entering, making them both Physical and Preventive."
            }
        ];

        // --- APP STATE ---
        let currentQuestionIndex = 0;
        let userAnswers = new Array(questions.length).fill(null);

        // --- DOM ELEMENTS ---
        const contentDiv = document.getElementById('examContent');
        const progressBar = document.getElementById('progressBar');

        // --- INITIALIZATION ---
        function init() {
            renderQuestion();
        }

        // --- RENDER FUNCTIONS ---
        function renderQuestion() {
            const q = questions[currentQuestionIndex];
            const isLastQuestion = currentQuestionIndex === questions.length - 1;
            
            // Update Progress
            const progress = ((currentQuestionIndex) / questions.length) * 100;
            progressBar.style.width = `${progress}%`;

            // HTML Structure for Question
            let html = `
                <div class="question-header">
                    <span class="question-number">QUESTION ${currentQuestionIndex + 1} OF ${questions.length}</span>
                    <span class="domain-tag">${q.domain}</span>
                </div>
                
                <div class="question-text">${q.q}</div>
                
                <div class="options">
                    ${q.options.map((opt, index) => {
                        const isSelected = userAnswers[currentQuestionIndex] === index;
                        const label = String.fromCharCode(65 + index); // A, B, C, D
                        return `
                            <div class="option ${isSelected ? 'selected' : ''}" onclick="selectOption(${index})">
                                <span class="option-label">${label}</span>
                                <span class="option-text">${opt}</span>
                            </div>
                        `;
                    }).join('')}
                </div>

                <div class="navigation">
                    <button class="btn" onclick="prevQuestion()" ${currentQuestionIndex === 0 ? 'disabled' : ''}>
                        &larr; Previous
                    </button>
                    <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" ${userAnswers[currentQuestionIndex] === null ? 'disabled' : ''}>
                        ${isLastQuestion ? 'Finish Exam' : 'Next &rarr;'}
                    </button>
                </div>
            `;

            contentDiv.innerHTML = html;
        }

        function selectOption(index) {
            userAnswers[currentQuestionIndex] = index;
            // Re-render to show selection state (or just toggle class for performance, but re-render is safer for state sync)
            renderQuestion();
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            // Calculate Score
            let correctCount = 0;
            questions.forEach((q, i) => {
                if (userAnswers[i] === q.correct) correctCount++;
            });

            const score = Math.round((correctCount / questions.length) * 100);
            const passed = score >= 83; // Approx 750/900
            progressBar.style.width = '100%';

            let html = `
                <div class="results">
                    <div class="score-card">
                        <div class="subtitle">EXAM RESULTS</div>
                        <div class="score-number">${score}</div>
                        <div class="subtitle">SCORE / 100</div>
                        <div class="pass-fail ${passed ? 'pass' : 'fail'}">
                            ${passed ? 'PASS' : 'FAIL'}
                        </div>
                    </div>

                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-number">${correctCount}</div>
                            <div class="stat-label">Correct</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${questions.length - correctCount}</div>
                            <div class="stat-label">Incorrect</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${questions.length}</div>
                            <div class="stat-label">Total Questions</div>
                        </div>
                    </div>

                    <div class="subtitle" style="margin-bottom: 20px;">Review Answers</div>

                    ${questions.map((q, i) => {
                        const userAnswer = userAnswers[i];
                        const isCorrect = userAnswer === q.correct;
                        const labelUser = String.fromCharCode(65 + userAnswer);
                        const labelCorrect = String.fromCharCode(65 + q.correct);

                        return `
                            <div class="review-question ${isCorrect ? 'correct' : 'incorrect'}">
                                <div class="review-header">
                                    <span>Question ${i + 1}</span>
                                    <span class="review-status ${isCorrect ? 'correct' : 'incorrect'}">
                                        ${isCorrect ? 'CORRECT' : 'INCORRECT'}
                                    </span>
                                </div>
                                <div class="review-text">${q.q}</div>
                                
                                <div class="review-answers">
                                    <div class="answer-line">
                                        <strong>Your Answer:</strong>
                                        <span style="color: ${isCorrect ? 'var(--accent-green)' : 'var(--accent-red)'}">
                                            ${labelUser}. ${q.options[userAnswer]}
                                        </span>
                                    </div>
                                    <div class="answer-line">
                                        <strong>Correct Answer:</strong>
                                        <span style="color: var(--accent-green)">
                                            ${labelCorrect}. ${q.options[q.correct]}
                                        </span>
                                    </div>
                                </div>

                                <div class="explanation">
                                    <div class="explanation-title">Explanation</div>
                                    ${q.explanation}
                                </div>
                            </div>
                        `;
                    }).join('')}

                    <div style="text-align: center; margin-top: 40px;">
                        <button class="btn btn-primary" onclick="location.reload()" style="display: inline-flex;">
                            Retake Exam
                        </button>
                    </div>
                </div>
            `;

            contentDiv.innerHTML = html;
            window.scrollTo(0,0);
        }

        // Start
        init();
    </script>
</body>
</html>
